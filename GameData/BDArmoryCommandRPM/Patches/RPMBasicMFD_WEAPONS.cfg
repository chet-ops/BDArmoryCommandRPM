// BDArmoryCommandRPM - WEAPONS interface for the basic RasterPropMonitor MFD (RasterPropMonitorBasicMFD)
// Used, among others, by the NMB F-14D, Type 20, Type 22 and Type 35 cockpits and by RPMPodPatches.
//
// * The CREW button (buttonR5) becomes WEAPONS (crew and flight log pages are removed).
// * Top row (A..G):       RADAR | EW/RWR | SMS | TGP | SYS | - | EXIT
// * Bottom row (R1..R7):  function keys of the mode
// * Side keys: UP DOWN ENTER ESC HOME RIGHT LEFT and NEXT/PREV (R9/R10)
// * EXIT (button G) or STBY go back to the home screen.

@PROP[RasterPropMonitorBasicMFD]:NEEDS[BDArmory&RasterPropMonitor]
{
	@MODULE[RasterPropMonitor]
	{
		!PAGE:HAS[#name[crewinfo]] {}
		!PAGE:HAS[#name[flightlog]] {}

		@PAGE,*:HAS[#text[JSI/RPMPodPatches/BasicMFD/*]]
		{
			@text ^= :^JSI/:BDArmoryCommandRPM/Labels/JSI/:
		}

		@PAGE:HAS[#name[home]]
		{
			unlockerPage = yes
		}

		PAGE
		{
			name = pBDAWeaponsBasic
			button = buttonR5
			lockingPage = yes
			PAGEHANDLER
			{
				name = BDAWeaponsPage
				method = ShowPage
				buttonClickMethod = ButtonProcessor
				buttonReleaseMethod = ButtonRelease
				pageActiveMethod = PageActive
				multiHandler = true

				modeButtons = button_A,button_B,button_C,button_D,button_E,button_F,button_G
				modeSlots = RADAR,EW,SMS,TGP,SYS,,EXIT
				modeWidths = 13,9,10,9,10,11,7
				modeRowTop = true

				functionButtons = buttonR1,buttonR2,buttonR3,buttonR4,buttonR5,buttonR6,buttonR7
				functionWidths = 13,9,10,10,10,10,6
				functionRowTop = false
				exitFunctionSlot = -1

				// globalButtons: 0 UP 1 DOWN 2 ENTER 3 ESC 4 HOME 5 RIGHT 6 LEFT 7 R9 8 R10
				keyMap = 0,1,6,5,4,2,3,7,8
				exitPage = home
				defaultMode = RADAR

				lineThickness = 2
				rangeSteps = 2500,5000,10000,20000,40000,80000,160000
				defaultRangeIndex = 3
				contactSize = 9
				rwrSymbolSize = 12
				rwrMaxListed = 4
				reticleSize = 0.12
				showAttitude = true
			}
			BACKGROUNDHANDLER
			{
				name = BDAWeaponsPage
				method = RenderPage
				multiHandler = true
			}
		}
	}
}
