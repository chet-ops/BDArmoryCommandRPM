// BDArmoryCommandRPM - sharp font for RasterPropMonitor MFDs
//
// Replaces the main font with BDAMainFont (16x32, generated from DejaVu Sans Mono Bold,
// with a 1 px margin around every glyph so no slivers of the neighbouring glyph leak in).
// Same cell size and same character order: no page layout changes.
// To go back to the original font, delete this file.

@PROP[ALCORMFD40x20|ALCORMFD60x30|RasterPropMonitorBasicMFD|NMB-MFD-F18|NMB-MFD3]:NEEDS[RasterPropMonitor]
{
	@MODULE[RasterPropMonitor]:HAS[#fontLetterWidth[16],#fontLetterHeight[32]]
	{
		@fontTransform = BDArmoryCommandRPM/Fonts/BDAMainFont
	}
}
