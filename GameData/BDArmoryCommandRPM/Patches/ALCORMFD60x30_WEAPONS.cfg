// BDArmoryCommandRPM - WEAPONS interface for the ASET ALCORMFD60x30 MFD
//
// * The CREW/FL.LOG button (buttonR4) becomes WEAPONS: it opens the BDArmory interface.
//   (this MFD's crew and flight log pages are removed)
// * The "CREW / FL.LOG" label on every page is replaced by "WEAPONS".
// * Inside WEAPONS the page is locked: the page buttons don't take you out of it.
//     Top row (R1..R6):        function keys of the current mode (labelled on screen)
//     STANDBY (top right):     EXIT, back to the original menu
//     Bottom row (R7..R10):    RADAR | EW/RWR | SMS | TGP/SYS (press again to toggle)
//     Side keys: UP DOWN LEFT RIGHT HOME NEXT PREV ZOOM+ ZOOM-, function depends on the mode

@PROP[ALCORMFD60x30]:NEEDS[BDArmory&RasterPropMonitor]
{
	@MODULE[RasterPropMonitor]
	{
		!PAGE:HAS[#name[pCrew60x30]] {}
		!PAGE:HAS[#name[pFlightLog60x30]] {}

		@PAGE,*:HAS[#text[ASET/ASET_Props/MFDs/*]]
		{
			@text ^= :^ASET/:BDArmoryCommandRPM/Labels/ASET/:
		}
		@PAGE,*:HAS[#textOverlay[ASET/ASET_Props/MFDs/*]]
		{
			@textOverlay ^= :^ASET/:BDArmoryCommandRPM/Labels/ASET/:
		}

		@PAGE:HAS[#name[pALCORStby60x30]]
		{
			unlockerPage = yes
		}

		PAGE
		{
			name = pBDAWeapons60x30
			button = buttonR4
			lockingPage = yes
			PAGEHANDLER
			{
				name = BDAWeaponsPage
				method = ShowPage
				buttonClickMethod = ButtonProcessor
				buttonReleaseMethod = ButtonRelease
				pageActiveMethod = PageActive
				multiHandler = true

				modeButtons = buttonR7,buttonR8,buttonR9,buttonR10
				modeSlots = RADAR,EW,SMS,TGP/SYS
				modeWidths = 19,15,16,15
				modeRowTop = false

				// the 7th slot is the STANDBY button: not hooked, RPM already returns to the menu with it
				functionButtons = buttonR1,buttonR2,buttonR3,buttonR4,buttonR5,buttonR6,
				functionWidths = 19,15,16,15,15,16,16
				functionRowTop = true
				exitFunctionSlot = 6

				// globalButtons: 0 UP 1 DOWN 2 ZoomIn 3 ZoomOut 4 HOME 5 RIGHT 6 LEFT 7 PREV 8 NEXT
				// order: Up,Down,Left,Right,Home,X1,X2,X3,X4
				keyMap = 0,1,6,5,4,8,7,3,2
				exitPage = pALCORStby60x30
				defaultMode = RADAR

				lineThickness = 2
				rangeSteps = 2500,5000,10000,20000,40000,80000,160000
				defaultRangeIndex = 3
				contactSize = 12
				rwrSymbolSize = 16
				rwrMaxListed = 6
				reticleSize = 0.12
				showAttitude = true
			}
			BACKGROUNDHANDLER
			{
				name = BDAWeaponsPage
				method = RenderPage
				multiHandler = true
			}
		}
	}
}
