// BDArmoryCommandRPM - WEAPONS interface for the ASET ALCORMFD40x20 MFD
//
// * The CREW button (buttonR5) becomes WEAPONS: it opens the BDArmory interface.
// * The "CREW" label on every page is replaced by "WEAPONS" (copies generated in BDArmoryCommandRPM/Labels).
// * Inside WEAPONS the page is locked: the page buttons don't take you out of it.
//     Top row (A..G):       RADAR | EW/RWR | SMS | TGP | SYS | - | EXIT
//     Bottom row (R1..R7):  function keys of the current mode (labelled on screen)
//     Side keys: UP DOWN LEFT RIGHT HOME ENTER ESC NEXT(R9) PREV(R10), function depends on the mode
// * EXIT (button G) or STBY go back to the original menu.

@PROP[ALCORMFD40x20]:NEEDS[BDArmory&RasterPropMonitor]
{
	@MODULE[RasterPropMonitor]
	{
		// Remove the crew page: its button becomes WEAPONS
		!PAGE:HAS[#name[pALCORCrew40x20]] {}

		// Read the page texts that carry the WEAPONS label
		@PAGE,*:HAS[#text[ASET/ASET_Props/MFDs/*]]
		{
			@text ^= :^ASET/:BDArmoryCommandRPM/Labels/ASET/:
		}
		@PAGE,*:HAS[#textOverlay[ASET/ASET_Props/MFDs/*]]
		{
			@textOverlay ^= :^ASET/:BDArmoryCommandRPM/Labels/ASET/:
		}

		// STBY unlocks (used to leave WEAPONS)
		@PAGE:HAS[#name[pALCORSTBY40x20]]
		{
			unlockerPage = yes
		}

		PAGE
		{
			name = pBDAWeapons40x20
			button = buttonR5
			lockingPage = yes
			PAGEHANDLER
			{
				name = BDAWeaponsPage
				method = ShowPage
				buttonClickMethod = ButtonProcessor
				buttonReleaseMethod = ButtonRelease
				pageActiveMethod = PageActive
				multiHandler = true

				modeButtons = button_A,button_B,button_C,button_D,button_E,button_F,button_G
				modeSlots = RADAR,EW,SMS,TGP,SYS,,EXIT
				modeWidths = 11,12,9,10,10,10,11
				modeRowTop = true

				functionButtons = buttonR1,buttonR2,buttonR3,buttonR4,buttonR5,buttonR6,buttonR7
				functionWidths = 13,10,9,10,9,10,11
				functionRowTop = false
				exitFunctionSlot = -1

				// globalButtons: 0 UP 1 DOWN 2 ENTER 3 ESC 4 HOME 5 RIGHT 6 LEFT 7 R9 8 R10
				// order: Up,Down,Left,Right,Home,X1,X2,X3,X4
				keyMap = 0,1,6,5,4,2,3,7,8
				exitPage = pALCORSTBY40x20
				defaultMode = RADAR

				lineThickness = 2
				rangeSteps = 2500,5000,10000,20000,40000,80000,160000
				defaultRangeIndex = 3
				contactSize = 9
				rwrSymbolSize = 12
				rwrMaxListed = 4
				reticleSize = 0.12
				showAttitude = true
			}
			BACKGROUNDHANDLER
			{
				name = BDAWeaponsPage
				method = RenderPage
				multiHandler = true
			}
		}
	}
}
