// BDArmoryCommandRPM - WEAPONS interface for NMB's F/A-18 style MFD (NMB-MFD-F18): F-18C and J-10C.
//
// * The crew button (button-R5) becomes WEAPONS (crew and flight log pages are removed).
// * Buttons of one row (A..E):       RADAR | EW/RWR | SMS | TGP | SYS   (STANDBY = EXIT)
// * Buttons of the other (R3..R7):   function keys of the mode
// * Side keys (UP DOWN ENTER ESC HOME RIGHT LEFT R9 R10): navigation depending on the mode
// * STANDBY also exits.
// Side keys: LEFT, RIGHT, R9, R10 on the left; UP, DOWN, ENTER, ESC and HOME (bottom corner) on the right.

@PROP[NMB-MFD-F18]:NEEDS[BDArmory&RasterPropMonitor]
{
	@MODULE[RasterPropMonitor]
	{
		!PAGE:HAS[#name[crewinfo]] {}
		!PAGE:HAS[#name[flightlog]] {}

		@PAGE:HAS[#name[home]]
		{
			unlockerPage = yes
		}

		PAGE
		{
			name = pBDAWeaponsF18
			button = button-R5
			lockingPage = yes
			PAGEHANDLER
			{
				name = BDAWeaponsPage
				method = ShowPage
				buttonClickMethod = ButtonProcessor
				buttonReleaseMethod = ButtonRelease
				pageActiveMethod = PageActive
				multiHandler = true

				modeButtons = button-A,button-B,button-C,button-D,button-E
				modeSlots = RADAR,EW,SMS,TGP,SYS
				// measured button positions: top row from 22 % to 78 % of the width, bottom row from 19 % to 81 %
				modeWidths = 10,10,10,10,10
				modeRowPad = 13
				modeRowTop = true

				functionButtons = button-R3,button-R4,button-R5,button-R6,button-R7
				functionWidths = 11,11,11,11,11
				functionRowPad = 10
				functionRowTop = false
				exitFunctionSlot = -1

				// globalButtons: 0 UP 1 DOWN 2 ENTER 3 ESC 4 home 5 RIGHT 6 LEFT 7 R9 8 R10
				keyMap = 0,1,6,5,4,2,3,7,8
				exitPage = home
				defaultMode = RADAR
				logLayout = false

				lineThickness = 2
				contactSize = 9
				rwrSymbolSize = 12
				rwrMaxListed = 4
				reticleSize = 0.12
				showAttitude = true
			}
			BACKGROUNDHANDLER
			{
				name = BDAWeaponsPage
				method = RenderPage
				multiHandler = true
			}
		}
	}
}
