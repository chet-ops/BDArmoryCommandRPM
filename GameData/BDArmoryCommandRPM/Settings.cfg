	// clip_zoom =
	// clip_servo =
	// clip_rwrNew =
	// clip_rwrNewAI =
	// clip_rwrSTT =
	// clip_rwrLaunch =
}

// Screens
BDARMORYCOMMANDRPM_DISPLAY
{
	sharpText = true     // sharp glyphs (Point filtering) on every RPM screen
	screenAniso = 4      // anisotropic filtering on screens: easier to read at an angle (0 = off)
	tgpMouseControl = true      // TGP: while holding Alt over the screen, left-drag slews the camera and the wheel zooms
	tgpMouseKey = Alt           // key to hold: Alt (either), None (no key) or a Unity KeyCode (LeftControl, LeftShift...)
	tgpMouseSensitivity = 1.0   // mouse slew speed (0.5 = half, 2 = double)
	tgpInvertWheel = false      // invert the wheel direction for zoom
	hideBDAWindowsInIVA = true  // hide BDArmory's floating windows (radar, camera...) while in the cockpit (IVA)
}
