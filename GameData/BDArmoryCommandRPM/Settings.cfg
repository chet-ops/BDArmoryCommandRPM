// BDArmoryCommandRPM - settings
//
// Cockpit sounds are synthesized at startup. To use your own recordings, copy an .ogg or .wav
// into GameData and put its path (without extension) in the matching clip, for example:
//     clip_lock = BDArmoryCommandRPM/Sounds/my_lock_tone
// BDArmory already plays its own sounds for the RWR, incoming missile, IR growl, ARM and weapon change.

BDARMORYCOMMANDRPM_AUDIO
{
	enabled = true
	onlyInIVA = true        // only play inside the cockpit (IVA)
	volume = 0.8            // normal sounds (buttons, radar...): multiplied by the game's "Ship" volume
	alarmVolume = 1.0       // alarms and RWR: only multiplied by the "Ship" volume (1.0 = maximum)
	buttonClicks = true     // click when pressing the MFD buttons
	radarSweep = false      // soft tick on every radar sweep (real aircraft don't have it)
	sweepVolume = 0.35
	bingoFraction = 0.25    // BINGO warning when less than this fraction of flares/chaff is left
	cautionHP = 0.5         // caution (ding-dong) below this fraction of health
	warningHP = 0.25        // warning below this fraction of health

	// F/A-18 style RWR (AN/ALR-67): replaces BDArmory's RWR beeps
	hornetRWR = true
	muteBDAMissileWarning = true   // mutes BDArmory's generic missile warning (the RWR plays the launch tone)
	rwrVolume = 0.9
	newEmitterMemory = 10          // seconds without seeing an emitter before it is announced again

	// Optional replacements (uncomment and set the path):
	// clip_click =
	// clip_radarOn =
	// clip_radarOff =
	// clip_sweep =
	// clip_contact =
	// clip_lock =
